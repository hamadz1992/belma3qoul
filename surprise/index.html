<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b43"><title>مفاجأة بزار | كل شيء بالمعقول</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#effaf5,#fff,#fff8e7);color:#17352d;display:grid;place-items:center;padding:16px}.card{width:min(100%,440px);background:#fff;border:1px solid #e8eee9;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #123b2a1c}.hero{padding:30px 22px 25px;text-align:center;color:#fff;background:linear-gradient(145deg,#075b43,#087653,#c99a32)}.gift{width:72px;height:72px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#ffffff20;border:1px solid #ffffff45;font-size:38px}.eyebrow{margin:12px 0 0;font-size:12px;font-weight:800}.hero h1{margin:5px 0 0;font-size:30px}.hero p{margin:8px 0 0;font-size:14px;line-height:1.8}.body{padding:24px;text-align:center}.body h2{font-size:21px;margin:7px 0;color:#075b43}.body p{font-size:13px;line-height:1.9;color:#64746e;margin:0 0 18px}.claim,.link{display:block;width:100%;border:0;cursor:pointer;background:#075b43;color:#fff;padding:14px 18px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;text-decoration:none;box-shadow:0 8px 22px #075b4330}.claim:disabled{opacity:.65;cursor:wait}.result{display:none;margin-top:16px;padding:18px;border-radius:18px;background:#f5faf7;border:1px solid #dcebe3}.result.win,.result.lost,.result.error{display:block}.result.lost{background:#fff9ed;border-color:#f0dfb4}.result.error{background:#fff1f2;border-color:#fecdd3}.result h3{margin:0 0 7px;font-size:19px}.result p{margin:0;color:#52635d}.prize{margin:14px 0;padding:14px;border-radius:14px;background:#fff;border:1px dashed #c99a32;font-weight:800;color:#075b43}.note{font-size:11px!important;color:#94a39d!important;margin-top:15px!important;margin-bottom:0!important}.small{font-size:11px;color:#94a39d;margin-top:12px}.winner-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(2,18,13,.9);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:24px;overflow:hidden}.winner-overlay.show{display:flex}.winner-content{position:relative;z-index:2;width:min(92vw,560px);text-align:center;color:#fff;animation:pop .45s ease-out}.winner-content h2{margin:0 0 10px;font-size:30px;text-shadow:0 3px 18px rgba(0,0,0,.35)}.winner-content p{margin:0 0 16px;font-size:15px;opacity:.95}.winner-image-wrap{display:inline-flex;max-width:min(92vw,520px);max-height:70vh;padding:10px;border-radius:24px;background:#fff;box-shadow:0 0 0 2px #c99a32,0 0 50px rgba(255,215,92,.45);align-items:center;justify-content:center}.winner-image{display:block;max-width:100%;max-height:65vh;width:auto;height:auto;object-fit:contain;border-radius:18px}.close-winner{margin-top:18px;border:0;border-radius:14px;padding:11px 20px;background:#fff;color:#075b43;font:inherit;font-weight:900;cursor:pointer}.fireworks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}@keyframes pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}@media(max-width:500px){.winner-content h2{font-size:25px}.winner-content p{font-size:13px}.winner-image-wrap{max-height:68vh}.winner-image{max-height:62vh}}</style></head><body><main class="card"><section class="hero"><div class="gift">🎁</div><div class="eyebrow">بزار كل شيء بالمعقول</div><h1 id="title">مفاجأة بزار</h1><p id="headline">🎁 افتح المفاجأة… وقد تكون من الفائزين!</p></section><section class="body"><h2 id="sub">🎉 مفاجأة خاصة</h2><p id="description"></p><button class="claim" id="claim">استلم المفاجأة 🎁</button><div class="result" id="result"></div><div class="small" id="limit"></div><p class="note">يمكن تغيير نوع المفاجأة أو الرابط أو الصورة أو الجائزة لاحقًا مع الإبقاء على رمز QR نفسه.</p></section></main><div class="winner-overlay" id="winnerOverlay"><canvas class="fireworks" id="fireworks"></canvas><div class="winner-content"><h2>🎉 مبروك! أنت من الفائزين 🎉</h2><p id="overlayText">هذه هي مفاجأتك الخاصة</p><div id="overlayMedia"></div><button class="close-winner" id="closeWinner">إغلاق</button></div></div><script>(async()=>{const $=id=>document.getElementById(id);const claim=$('claim'),result=$('result');try{const r=await fetch('config.js?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل إعدادات الحملة');const text=await r.text();const m=text.match(/window\.SURPRISE_CONFIG\s*=\s*(\{[\s\S]*\})\s*;?/);if(!m)throw new Error('صيغة الإعدادات غير صالحة');const c=Function('return '+m[1])();const key='belma3qoul_surprise_'+(c.campaignId||'default');const API='https://countapi.mileshilliard.com/api/v1/hit/'+encodeURIComponent(key);$('title').textContent=c.title||'مفاجأة بزار';$('headline').textContent=c.headline||'🎁 افتح المفاجأة… وقد تكون من الفائزين!';$('description').textContent=c.description||'';$('limit').textContent=`عدد الفائزين في هذه الجولة: ${c.maxWinners||1}`;if(c.enabled===false){claim.disabled=true;claim.textContent='الجولة متوقفة حاليًا'}function show(cls,title,text,prize){result.className='result '+cls;result.innerHTML=`<h3>${title}</h3><p>${text}</p>${prize?`<div class="prize">${prize}</div>`:''}`}function startFireworks(){const canvas=$('fireworks'),ctx=canvas.getContext('2d');let w=canvas.width=innerWidth,h=canvas.height=innerHeight;const p=[];function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}addEventListener('resize',resize);function burst(x,y){for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:55+Math.random()*35,r:1+Math.random()*2.5})}}let t=0;function loop(){ctx.clearRect(0,0,w,h);if(t++%20===0)burst(70+Math.random()*(w-140),80+Math.random()*h*.45);for(let i=p.length-1;i>=0;i--){const q=p[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.life--;ctx.globalAlpha=Math.max(0,q.life/90);ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=i%3===0?'#ffd866':i%3===1?'#ffffff':'#8ff0c8';ctx.fill();if(q.life<=0)p.splice(i,1)}requestAnimationFrame(loop)}loop()}function showWinnerOverlay(){const o=$('winnerOverlay'),m=$('overlayMedia');$('overlayText').textContent=c.winnerDescription||'هذه هي مفاجأتك الخاصة 🎁';m.innerHTML='';if(c.imageUrl){const w=document.createElement('div');w.className='winner-image-wrap';const img=document.createElement('img');img.className='winner-image';img.alt='الجائزة';img.src=c.imageUrl+'?cb='+Date.now();w.appendChild(img);m.appendChild(w)}else{const w=document.createElement('div');w.className='winner-image-wrap';w.style.padding='28px 36px';w.textContent=c.prizeText||'مفاجأة خاصة من بزار كل شيء بالمعقول';m.appendChild(w)}o.classList.add('show');startFireworks()}claim.addEventListener('click',async()=>{if(claim.disabled)return;claim.disabled=true;claim.textContent='جارٍ التحقق…';try{const rr=await fetch(API,{cache:'no-store'});if(!rr.ok)throw 0;const d=await rr.json(),n=Number(d.value);if(n<=Number(c.maxWinners||1)){show('win',c.winnerText||'🎉 مبروك! أنت من الفائزين',c.winnerDescription||'تم تسجيل مطالبتك بنجاح.',`${c.prizeTitle||'🎁 الجائزة'}: ${c.prizeText||'مفاجأة خاصة من بزار كل شيء بالمعقول'}`);claim.textContent='تم تسجيل المطالبة ✓';if(c.type==='link'&&c.externalLink){setTimeout(()=>{location.href=c.externalLink},700)}else if(c.imageUrl||c.type!=='link'){setTimeout(showWinnerOverlay,350)}}else{show('lost',c.endedText||'😔 انتهت المفاجأة',c.endedDescription||'سبقك فائز آخر وحصل على الجائزة.');claim.textContent='انتهت هذه الجولة'}}catch(e){claim.disabled=false;claim.textContent=c.actionText||'استلم المفاجأة 🎁';show('error','تعذر التحقق الآن','حدث خطأ مؤقت في خدمة التحقق. حاول مرة أخرى بعد قليل.')}});$('closeWinner').onclick=()=>{$('winnerOverlay').classList.remove('show')};$('winnerOverlay').addEventListener('click',e=>{if(e.target.id==='winnerOverlay')e.currentTarget.classList.remove('show')})}catch(e){claim.disabled=true;claim.textContent='تعذر تحميل الحملة';show('error','تعذر تحميل الحملة',e.message)}})();</script></body></html>
