<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b43">
<title>مفاجأة بزار | كل شيء بالمعقول</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#effaf5,#fff,#fff8e7);color:#17352d;display:grid;place-items:center;padding:16px}.card{width:min(100%,440px);background:#fff;border:1px solid #e8eee9;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #123b2a1c}.hero{padding:30px 22px 25px;text-align:center;color:#fff;background:linear-gradient(145deg,#075b43,#087653,#c99a32)}.gift{width:72px;height:72px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#ffffff20;border:1px solid #ffffff45;font-size:38px}.eyebrow{margin:12px 0 0;font-size:12px;font-weight:800}.hero h1{margin:5px 0 0;font-size:30px}.hero p{margin:8px 0 0;font-size:14px;line-height:1.8}.body{padding:24px;text-align:center}.qr{width:180px;height:180px;margin:0 auto 18px;padding:9px;border:1px solid #ead9a9;border-radius:20px;background:#fff}.qr img{width:100%;height:100%;display:block}.body h2{font-size:21px;margin:7px 0;color:#075b43}.body p{font-size:13px;line-height:1.9;color:#64746e;margin:0 0 18px}.claim{width:100%;border:0;cursor:pointer;background:#075b43;color:#fff;padding:14px 18px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;box-shadow:0 8px 22px #075b4330}.claim:disabled{opacity:.65;cursor:wait}.result{display:none;margin-top:16px;padding:18px;border-radius:18px;background:#f5faf7;border:1px solid #dcebe3}.result.win{display:block}.result.lost{display:block;background:#fff9ed;border-color:#f0dfb4}.result.error{display:block;background:#fff1f2;border-color:#fecdd3}.result h3{margin:0 0 7px;font-size:19px}.result p{margin:0;color:#52635d}.prize{margin:14px 0;padding:14px;border-radius:14px;background:#fff;border:1px dashed #c99a32;font-weight:800;color:#075b43}.note{font-size:11px!important;color:#94a39d!important;margin-top:15px!important;margin-bottom:0!important}.small{font-size:11px;color:#94a39d;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<section class="hero"><div class="gift">🎁</div><div class="eyebrow">بزار كل شيء بالمعقول</div><h1>مفاجأة بزار</h1><p>✨ امسح… وقد تكون من الفائزين!</p></section>
<section class="body">
<div class="qr"><img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=https%3A%2F%2Fhamadz1992.github.io%2Fbelma3qoul%2F"></div>
<h2>🎉 مفاجأة خاصة</h2>
<p>هناك فائز واحد فقط في هذه الجولة. اضغط الزر للمطالبة بالمفاجأة ومعرفة ما إذا كنت أول فائز.</p>
<button class="claim" id="claim">استلم المفاجأة 🎁</button>
<div class="result" id="result"></div>
<div class="small">الجائزة تُمنح لأول مطالبة ناجحة فقط.</div>
<p class="note">يمكن تغيير محتوى الجائزة لاحقًا مع الإبقاء على رمز QR نفسه.</p>
</section>
</main>
<script>
const COUNTER_KEY='belma3qoul_surprise_first_winner_2026_08_17_7c4e91b2';
const API='https://countapi.mileshilliard.com/api/v1/hit/'+COUNTER_KEY;
const claim=document.getElementById('claim');
const result=document.getElementById('result');
const claimed=localStorage.getItem('belma3qoul_surprise_claimed_'+COUNTER_KEY)==='1';
function show(type,title,text,prize=''){
  result.className='result '+type;
  result.innerHTML='<h3>'+title+'</h3><p>'+text+'</p>'+(prize?'<div class="prize">'+prize+'</div>':'');
}
if(claimed){claim.disabled=true;claim.textContent='تمت المطالبة من هذا الجهاز';show('win','🎉 لديك مطالبة مسجلة','إذا كنت أول فائز في الجولة فستظهر لك الجائزة عند المطالبة الأولى.');}
claim.addEventListener('click',async()=>{
  if(claim.disabled)return;
  claim.disabled=true;claim.textContent='جارٍ التحقق…';result.className='result';result.innerHTML='';
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok)throw new Error('counter');
    const data=await r.json();
    const n=Number(data.value);
    if(n===1){
      localStorage.setItem('belma3qoul_surprise_claimed_'+COUNTER_KEY,'1');
      show('win','🎉 مبروك! أنت الفائز الأول','تم تسجيل مطالبتك بنجاح.','🎁 الجائزة الحالية: مفاجأة خاصة من بزار كل شيء بالمعقول');
      claim.textContent='تم تسجيل المطالبة ✓';
    }else{
      show('lost','😔 انتهت المفاجأة','سبقك شخص آخر وحصل على الجائزة. تابعنا للمفاجأة القادمة 🎁');
      claim.textContent='انتهت هذه الجولة';
    }
  }catch(e){
    claim.disabled=false;claim.textContent='استلم المفاجأة 🎁';
    show('error','تعذر التحقق الآن','حدث خطأ مؤقت في خدمة التحقق. حاول مرة أخرى بعد قليل.');
  }
});
</script>
</body>
</html>
