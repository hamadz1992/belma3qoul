name: Publish Surprise Page

on:
  push:
    branches: [main]
    paths:
      - 'surprise/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload surprise page
        uses: actions/upload-pages-artifact@v3
        with:
          path: './surprise'
          name: surprise-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: surprise-pages

# Deploy artifact name is intentionally unique to avoid collisions with prior runs.
